name: Build and publish thcabinets-web

on:
  push:
    branches: [master]
    paths:
      - "thcabinets-splash/app/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

# A new push cancels any still-running build for the same branch, rather than
# leaving an old run to hang around (or occasionally stall for a long time on
# the multi-arch build step — a GitHub Actions runner/cache issue, not this
# workflow's code) alongside a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/thcabinets-web

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build single-arch image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: thcabinets-splash/app
          load: true
          tags: thcabinets-web:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          docker run -d --name smoke-test -p 3000:3000 thcabinets-web:smoke-test
          trap 'docker logs smoke-test || true; docker rm -f smoke-test || true' EXIT

          echo "Waiting for the server to come up..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then
              echo "Server is up."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server never came up." >&2
              exit 1
            fi
            sleep 1
          done

          echo "GET /api/photos should start empty..."
          body=$(curl -sf http://localhost:3000/api/photos)
          [ "$body" = "[]" ] || { echo "Expected [], got: $body" >&2; exit 1; }

          echo "Uploading a test photo..."
          printf '%s' "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" | base64 -d > /tmp/test.png
          upload_response=$(curl -sf -F "photos=@/tmp/test.png;type=image/png" -F "tags=ci-test" http://localhost:3000/api/photos)
          echo "$upload_response"
          failed_count=$(echo "$upload_response" | jq -r '.failed | length')
          [ "$failed_count" = "0" ] || { echo "Expected no failed uploads, got: $upload_response" >&2; exit 1; }
          photo_id=$(echo "$upload_response" | jq -r '.created[0].id')
          thumb_url=$(echo "$upload_response" | jq -r '.created[0].thumbUrl')
          width=$(echo "$upload_response" | jq -r '.created[0].width')
          [ "$photo_id" != "null" ] || { echo "No photo id in response" >&2; exit 1; }
          [ "$thumb_url" != "null" ] && [ -n "$thumb_url" ] || { echo "No thumbUrl in response" >&2; exit 1; }
          [ "$width" = "1" ] || { echo "Expected width 1, got $width" >&2; exit 1; }

          echo "Confirming it shows up in the listing..."
          curl -sf http://localhost:3000/api/photos | jq -e ".[] | select(.id == $photo_id)" > /dev/null

          echo "Editing tags..."
          curl -sf -X PATCH -H "Content-Type: application/json" -d '{"tags":"ci-test-edited"}' \
            "http://localhost:3000/api/photos/$photo_id" | jq -e '.tags == "ci-test-edited"' > /dev/null

          echo "Deleting..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:3000/api/photos/$photo_id")
          [ "$status" = "204" ] || { echo "Expected 204 on delete, got $status" >&2; exit 1; }

          echo "Confirming it's gone..."
          body=$(curl -sf http://localhost:3000/api/photos)
          [ "$body" = "[]" ] || { echo "Expected [] after delete, got: $body" >&2; exit 1; }

          echo "Photo API smoke test passed."

          echo "--- Schedule API ---"

          echo "GET /api/workers should have the seeded roster..."
          worker_count=$(curl -sf http://localhost:3000/api/workers | jq 'length')
          [ "$worker_count" -ge 1 ] || { echo "Expected at least 1 seeded worker, got $worker_count" >&2; exit 1; }

          echo "Creating a CI worker..."
          worker_id=$(curl -sf -X POST -H "Content-Type: application/json" -d '{"name":"CI Worker"}' \
            http://localhost:3000/api/workers | jq -r '.id')
          [ "$worker_id" != "null" ] || { echo "No worker id returned" >&2; exit 1; }

          echo "GET /api/schedule should return a two-week fortnight, 7 days apart..."
          schedule=$(curl -sf "http://localhost:3000/api/schedule?week=2025-11-19")
          week1_start=$(echo "$schedule" | jq -r '.weeks[0].start')
          week2_start=$(echo "$schedule" | jq -r '.weeks[1].start')
          week1_dow=$(date -u -d "$week1_start" +%u)
          [ "$week1_dow" = "1" ] || { echo "Expected week1 to start on a Monday, got $week1_start (dow $week1_dow)" >&2; exit 1; }
          expected_week2=$(date -u -d "$week1_start + 7 days" +%F)
          [ "$week2_start" = "$expected_week2" ] || { echo "Expected week2 $expected_week2, got $week2_start" >&2; exit 1; }

          echo "Adding a job row to week 1 manufacturing..."
          row=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"weekStart\":\"$week1_start\",\"panel\":\"manufacturing\",\"jobName\":\"CI Job\",\"notes\":\"n1\"}" \
            http://localhost:3000/api/rows)
          row_id=$(echo "$row" | jq -r '.rowId')
          job_id=$(echo "$row" | jq -r '.jobId')
          [ "$row_id" != "null" ] || { echo "No rowId returned: $row" >&2; exit 1; }

          echo "Confirming the job shows up in /api/jobs..."
          curl -sf http://localhost:3000/api/jobs | jq -e ".[] | select(.id == $job_id and .name == \"CI Job\")" > /dev/null

          echo "Assigning the CI worker to Monday..."
          assignment=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"day\":\"mon\",\"workerId\":$worker_id}" \
            "http://localhost:3000/api/rows/$row_id/assignments")
          assignment_id=$(echo "$assignment" | jq -r '.assignmentId')
          [ "$assignment_id" != "null" ] || { echo "No assignmentId returned: $assignment" >&2; exit 1; }

          echo "Confirming the assignment shows up in the schedule..."
          curl -sf "http://localhost:3000/api/schedule?week=$week1_start" \
            | jq -e ".weeks[0].manufacturing[] | select(.rowId == $row_id) | .cells.mon[] | select(.workerId == $worker_id)" > /dev/null

          echo "Editing job notes..."
          curl -sf -X PATCH -H "Content-Type: application/json" -d '{"notes":"updated"}' \
            "http://localhost:3000/api/jobs/$job_id" | jq -e '.notes == "updated"' > /dev/null

          echo "Duplicating the row to next week..."
          dup=$(curl -sf -X POST -H "Content-Type: application/json" -d '{}' \
            "http://localhost:3000/api/rows/$row_id/duplicate")
          dup_row_id=$(echo "$dup" | jq -r '.rowId')
          [ "$dup_row_id" != "null" ] && [ "$dup_row_id" != "$row_id" ] || { echo "Duplicate row not created: $dup" >&2; exit 1; }
          curl -sf "http://localhost:3000/api/schedule?week=$week1_start" \
            | jq -e ".weeks[1].manufacturing[] | select(.rowId == $dup_row_id) | .cells.mon[] | select(.workerId == $worker_id)" > /dev/null

          echo "Adding a job row to week 1 installing (for flag testing)..."
          install_row=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"weekStart\":\"$week1_start\",\"panel\":\"installing\",\"jobId\":$job_id}" \
            http://localhost:3000/api/rows)
          install_row_id=$(echo "$install_row" | jq -r '.rowId')
          [ "$install_row_id" != "null" ] || { echo "No rowId returned: $install_row" >&2; exit 1; }

          echo "Flagging Tuesday as locked in on the installing row..."
          curl -sf -X POST -H "Content-Type: application/json" -d '{"day":"tue"}' \
            "http://localhost:3000/api/rows/$install_row_id/flags" | jq -e '.flagged == true' > /dev/null

          echo "Confirming the flag shows up in the schedule response..."
          curl -sf "http://localhost:3000/api/schedule?week=$week1_start" \
            | jq -e ".weeks[0].installing[] | select(.rowId == $install_row_id) | .flags.tue == true" > /dev/null

          echo "Flagging a manufacturing row should be rejected..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"day":"mon"}' \
            "http://localhost:3000/api/rows/$row_id/flags")
          [ "$status" = "400" ] || { echo "Expected 400 flagging a manufacturing row, got $status" >&2; exit 1; }

          echo "Unflagging Tuesday..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:3000/api/rows/$install_row_id/flags/tue")
          [ "$status" = "204" ] || { echo "Expected 204 unflagging, got $status" >&2; exit 1; }
          curl -sf "http://localhost:3000/api/schedule?week=$week1_start" \
            | jq -e ".weeks[0].installing[] | select(.rowId == $install_row_id) | .flags.tue == false" > /dev/null

          echo "Cleaning up the installing row..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:3000/api/rows/$install_row_id")
          [ "$status" = "204" ] || { echo "Expected 204 deleting installing row, got $status" >&2; exit 1; }

          echo "Flag smoke test passed."

          echo "Archiving the CI worker..."
          curl -sf -X PATCH -H "Content-Type: application/json" -d '{"archived":true}' \
            "http://localhost:3000/api/workers/$worker_id" | jq -e '.archived == true' > /dev/null

          echo "Deleting the assignment and both rows..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:3000/api/assignments/$assignment_id")
          [ "$status" = "204" ] || { echo "Expected 204 deleting assignment, got $status" >&2; exit 1; }
          status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:3000/api/rows/$row_id")
          [ "$status" = "204" ] || { echo "Expected 204 deleting row, got $status" >&2; exit 1; }
          status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:3000/api/rows/$dup_row_id")
          [ "$status" = "204" ] || { echo "Expected 204 deleting dup row, got $status" >&2; exit 1; }

          echo "Schedule API smoke test passed."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: thcabinets-splash/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
