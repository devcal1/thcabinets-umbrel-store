<style>
:root {
  --bg: #14161a;
  --surface: #1c1f25;
  --surface-2: #23272e;
  --surface-3: #2a2f37;
  --border: #2e343d;
  --text: #e6e9ee;
  --text-dim: #97a0ad;
  --accent: #4a9eff;
  --good: #3fb87f;
  --warn: #e0a33e;
  --bad: #e05c5c;
  --money: #7ee0a8;
  --radius: 8px;
  --sp1: 8px; --sp2: 16px; --sp3: 24px; --sp4: 32px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
body { min-height: 100vh; }
h1,h2,h3,h4 { margin: 0 0 8px 0; font-weight: 600; }
h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0 0 8px 0; line-height: 1.5; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
input, select, textarea { font-family: inherit; font-size: inherit; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; width: 100%; }
input[type=number] { text-align: right; font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 60px; }
label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 3px; }
button { font-family: inherit; font-size: inherit; cursor: pointer; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
button.ghost { background: transparent; border-color: transparent; }
button.small { padding: 3px 9px; font-size: 12px; }
button:disabled { opacity: .4; cursor: default; }
a { color: var(--accent); cursor: pointer; }
.money { color: var(--money); font-variant-numeric: tabular-nums; font-weight: 600; }
.dim { color: var(--text-dim); }
.small { font-size: 12px; }
.right { text-align: right; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); white-space: nowrap; }
.chip.good { color: var(--good); border-color: var(--good); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.chip.bad { color: var(--bad); border-color: var(--bad); }
.chip.info { color: var(--accent); border-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp2); }
.stack { display: flex; flex-direction: column; gap: var(--sp2); }
.stack.tight { gap: var(--sp1); }
.row { display: flex; gap: var(--sp2); align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid { display: grid; gap: var(--sp2); }
.grid.cols-2 { grid-template-columns: 1fr 1fr; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
.spacer { flex: 1; }
.hint { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.banner { border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.banner.warn { background: rgba(224,163,62,.12); border: 1px solid var(--warn); color: var(--warn); }
.banner.bad { background: rgba(224,92,92,.12); border: 1px solid var(--bad); color: var(--bad); }
.banner.info { background: rgba(74,158,255,.1); border: 1px solid var(--accent); color: var(--accent); }

/* Nav */
.nav { display: flex; align-items: center; gap: var(--sp3); padding: 10px var(--sp3); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 50; }
.nav-brand { font-weight: 700; font-size: 15px; }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab { background: transparent; border: 1px solid transparent; color: var(--text-dim); }
.nav-tab.active { color: var(--text); background: var(--surface-2); border-color: var(--border); }
.nav-right { margin-left: auto; display: flex; gap: var(--sp2); align-items: center; }
.view { padding: var(--sp3); max-width: 1400px; margin: 0 auto; }

/* Dashboard */
.tile-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--sp2); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.tile .tile-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
.tile .tile-value { font-size: 20px; font-weight: 700; margin: 4px 0; }
.tile .tile-n { font-size: 11px; color: var(--text-dim); }
.panel { margin-top: var(--sp3); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.panel-filter-note { font-size: 12px; color: var(--text-dim); }
.suppressed { color: var(--text-dim); font-size: 13px; padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; margin-bottom: var(--sp3); }
.filter-bar .field { min-width: 130px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
.legend .item { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
.checklist { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.checklist .step { font-size: 13px; color: var(--text-dim); }
.checklist .step.done { color: var(--good); }

/* Quote list */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: var(--sp3); }
.toolbar input[type=text] { max-width: 260px; }

/* Editor */
.editor-header { position: sticky; top: 49px; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 10px var(--sp3); display: flex; gap: var(--sp2); align-items: center; flex-wrap: wrap; }
.editor-header .field { min-width: 140px; }
.editor-header .header-total { margin-left: auto; text-align: right; }
.editor-header .header-total .money { font-size: 22px; }
.editor-body { display: grid; grid-template-columns: 1fr 340px; gap: var(--sp3); padding: var(--sp3); max-width: 1500px; margin: 0 auto; align-items: start; }
@media (max-width: 1000px) { .editor-body { grid-template-columns: 1fr; } }
.room-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: var(--sp2); }
.room-card-head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.room-card-body { padding: 12px 14px; }
.room-spec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.section-block { border-top: 1px solid var(--border); padding: 10px 0; }
.section-block:first-child { border-top: none; }
.section-title-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.section-title-row .st-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
.section-title-row .st-total { margin-left: auto; font-variant-numeric: tabular-nums; }
.item-row { display: grid; grid-template-columns: 1fr 70px 60px 90px 24px; gap: 8px; align-items: center; padding: 4px 0; }
.item-row .item-name { font-size: 13px; }
.item-row .item-rate { font-size: 12px; color: var(--text-dim); text-align: right; }
.add-item-row { padding-top: 6px; }
.room-footer { padding: 12px 14px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.rollup-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; font-size: 12px; margin-bottom: 8px; }
.rollup-grid .ri-label { color: var(--text-dim); }
.rollup-grid .ri-value { font-variant-numeric: tabular-nums; }
.benchmark-chip { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.job-summary-panel { position: sticky; top: 130px; }
.share-bar { height: 10px; border-radius: 4px; overflow: hidden; display: flex; margin: 6px 0; }
.hours-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; font-size: 12px; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp3);
  max-width: 640px; width: 92%; max-height: 86vh; overflow: auto; }
.modal h2 { margin-top: 0; }
.wizard-modal { max-width: 560px; }
.wizard-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: var(--sp3); }
.wizard-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.wizard-dots .dot.active { background: var(--accent); }

/* Settings */
.settings-layout { display: grid; grid-template-columns: 200px 1fr; gap: var(--sp3); }
.settings-nav { display: flex; flex-direction: column; gap: 2px; }
.settings-nav button { text-align: left; background: transparent; border-color: transparent; color: var(--text-dim); }
.settings-nav button.active { color: var(--text); background: var(--surface-2); border-color: var(--border); }
.field-row { display: grid; grid-template-columns: 220px 130px 1fr; gap: var(--sp2); align-items: start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.field-row .fr-label { font-size: 13px; }
.field-row .fr-unit { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.field-row .fr-help { font-size: 12px; color: var(--text-dim); }
.field-row .fr-detail { font-size: 12px; color: var(--text-dim); margin-top: 6px; padding: 8px; background: var(--surface-2); border-radius: 6px; display: none; }
.field-row .fr-detail.open { display: block; }
.catalogue-item-row { display: grid; grid-template-columns: 1.4fr 90px 90px 80px 90px 24px; gap: 8px; align-items: center; padding: 4px 0; }
.dropdown-list { display: flex; flex-wrap: wrap; gap: 6px; }
.dropdown-list .dl-tag { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 10px; font-size: 12px; }

.toast { position: fixed; bottom: 18px; right: 18px; background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 14px; font-size: 13px; z-index: 300; }

/* Print */
#print-root { display: none; }
@media print {
  @page { size: A4 portrait; margin: 14mm; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  #print-root, #print-root * {
    background: #fff !important; color: #000 !important; box-shadow: none !important;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  #print-root table { border-collapse: collapse; page-break-inside: auto; width: 100%; }
  #print-root tr { page-break-inside: avoid; }
  #print-root thead { display: table-header-group; }
  #print-root th, #print-root td { border-bottom: 1px solid #ccc; padding: 6px 4px; text-align: left; font-size: 12px; }
  #print-root td.num, #print-root th.num { text-align: right; }
  .print-header { display: flex; justify-content: space-between; margin-bottom: 18px; }
  .print-right { text-align: right; }
  .print-title { font-size: 18px; font-weight: 700; }
  .print-company-name { font-size: 16px; font-weight: 700; }
  .print-dim { color: #555; font-size: 12px; }
  .print-logo { max-height: 48px; margin-bottom: 6px; }
  .print-totals { width: 280px; margin-left: auto; margin-top: 10px; }
  .print-total-row td { font-weight: 700; font-size: 14px; border-top: 2px solid #000; }
  .print-section-title { font-weight: 700; margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; }
  .print-note { font-size: 11px; color: #666; margin-top: 4px; }
  .print-terms { font-size: 11px; color: #333; white-space: pre-wrap; }
}
</style>

<script>
"use strict";
/* ============================== utils.js ============================== */
const uid = () => 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const clamp = (n,min,max)=>Math.min(max,Math.max(min,n));
const deepClone = o => JSON.parse(JSON.stringify(o));
const byId = id => document.getElementById(id);
const escapeHtml = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtMoney(n) {
  if (n==null || isNaN(n)) n = 0;
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtMoney0(n) {
  if (n==null || isNaN(n)) n = 0;
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.round(Math.abs(n)).toLocaleString('en-AU');
}
function fmtPct(n, dp) {
  if (n==null || isNaN(n)) return '—';
  return (n*100).toFixed(dp==null?1:dp) + '%';
}
function fmtNum(n, dp) {
  if (n==null || isNaN(n)) return '0';
  return Number(n).toFixed(dp==null?2:dp);
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-AU', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(s) {
  const d = new Date(s);
  return d.toLocaleDateString('en-AU') + ' ' + d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
}
function sanitizeFilename(s) {
  return String(s||'quote').replace(/[\\/:*?"<>|]/g,'-').trim() || 'quote';
}
function getPath(obj, path) {
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function setPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let i=0;i<parts.length-1;i++) { if (o[parts[i]]==null) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}

/* ============================== calc.js ============================== */
const Calc = (() => {
  function cncPerSheet(catalogue, profileName) {
    const profile = catalogue.cnc && catalogue.cnc[profileName];
    if (!profile) return 0;
    const labourRate = (catalogue.otherLabourRates && catalogue.otherLabourRates['CNC Cut/Edging']) || 0;
    return ((labourRate/60) * profile.minsPerSheet) * (profile.costPerCutter / profile.sheetsPerCutter);
  }

  function itemRate(item, section, catalogue, quote) {
    if (section.kind === 'board') {
      return (item.boardCost||0) + (item.edgeCost100m||0)/4 + cncPerSheet(catalogue, item.cncProfile);
    }
    if (section.kind === 'travel') {
      return (quote.kmFromFactory||0) * (item.perKm||0);
    }
    return item.rate || 0; // simple | labour
  }

  function sectionQtyMap(room, sectionId) {
    return (room.qty && room.qty[sectionId]) || {};
  }

  function sumQty(room, section) {
    const m = sectionQtyMap(room, section.id);
    let s = 0;
    for (const k in m) s += (Number(m[k]) || 0);
    return s;
  }

  function sectionTotal(room, section, catalogue, quote) {
    const m = sectionQtyMap(room, section.id);
    let total = 0;
    for (const item of section.items) {
      const q = Number(m[item.name]) || 0;
      if (!q) continue;
      total += q * itemRate(item, section, catalogue, quote);
    }
    return total;
  }

  function bucketTotal(bySection, catalogue, bucket) {
    let s = 0;
    for (const section of catalogue.sections) if (section.costBucket === bucket) s += (bySection[section.id]||0);
    return s;
  }

  function overheadHourlyRate(catalogue) {
    const o = catalogue.overhead;
    if (!o || !o.jobsPerDay || !o.hoursPerDay) return 0;
    return o.dailyRunningCost / o.jobsPerDay / o.hoursPerDay;
  }

  function computeRoom(room, catalogue, quote) {
    const bySection = {};
    for (const section of catalogue.sections) bySection[section.id] = sectionTotal(room, section, catalogue, quote);

    const labourOffice = bucketTotal(bySection, catalogue, 'labourOffice');
    const labourWorkshop = bucketTotal(bySection, catalogue, 'labourWorkshop');
    const materials = bucketTotal(bySection, catalogue, 'materials');
    const travelCost = bucketTotal(bySection, catalogue, 'overheads');

    let officeHoursRaw=0, factoryHoursRaw=0, siteHoursRaw=0, travelQtyRaw=0;
    for (const section of catalogue.sections) {
      if (section.hoursBucket === 'office') officeHoursRaw += sumQty(room, section);
      else if (section.hoursBucket === 'factory') factoryHoursRaw += sumQty(room, section);
      else if (section.hoursBucket === 'site') siteHoursRaw += sumQty(room, section);
      else if (section.hoursBucket === 'travel') travelQtyRaw += sumQty(room, section);
    }
    const officeHours = officeHoursRaw;
    const factoryHours = factoryHoursRaw / 2;
    const siteHours = siteHoursRaw / 2;
    const travelHours = ((travelQtyRaw * (quote.kmFromFactory||0)) / 60) * 2;

    const ohRate = overheadHourlyRate(catalogue);
    const overheadRecovery = (officeHours+factoryHours+siteHours+travelHours) * ohRate;
    const overheads = overheadRecovery + travelCost;

    const tiers = catalogue.clientTiers || [];
    const tier = tiers.find(t=>t.code===quote.clientTier) || tiers[0] || {materialMarkup:1};
    const markupFactor = tier.materialMarkup;
    const markup = materials*markupFactor - materials;

    const base = labourOffice + labourWorkshop + materials + markup + overheads;
    const adjustPct = Number(room.adjust) || 0;
    const adjustFactor = 1 + adjustPct;
    const adjust = base*adjustFactor - base;

    const exGst = base + adjust;
    const incGst = exGst * (1 + (catalogue.gstRate||0));

    const cf = catalogue.cogs || {labourFactor:0.65, materialsFactor:1.10};
    const cogs = labourOffice*cf.labourFactor + labourWorkshop*cf.labourFactor + materials*cf.materialsFactor + overheads;
    const cogsRatio = incGst > 0 ? cogs/incGst : 0;
    const profit = incGst - cogs;

    const warnCogs = incGst > 0 && cogsRatio > ((catalogue.warnings && catalogue.warnings.roomCogsRatioMax) != null ? catalogue.warnings.roomCogsRatioMax : 0.8);

    return { bySection, labourOffice, labourWorkshop, materials, travelCost,
      officeHours, factoryHours, siteHours, travelHours,
      overheadRecovery, overheads, markupFactor, markup, base, adjust, exGst, incGst,
      cogs, cogsRatio, profit, warnCogs };
  }

  function computeBonus(jobIncGst, roomResults, catalogue) {
    const b = catalogue.bonus || {poolPctOfTotal:0.01, poolMultiplier:1.5, split:{office:.5,factory:.25,site:.25}};
    const adjustSum = roomResults.reduce((s,r)=>s+r.adjust,0);
    const pool = (jobIncGst * b.poolPctOfTotal * b.poolMultiplier) + (adjustSum/2);
    return { pool, office: pool*b.split.office, factory: pool*b.split.factory, site: pool*b.split.site };
  }

  function computeQuote(quote, catalogue) {
    const rooms = (quote.rooms||[]).map(room => ({ room, r: computeRoom(room, catalogue, quote) }));
    const jobExGst = rooms.reduce((s,x)=>s+x.r.exGst,0);
    const jobIncGst = rooms.reduce((s,x)=>s+x.r.incGst,0);

    const share = {
      office: rooms.reduce((s,x)=>s+x.r.labourOffice,0)*1.1,
      labour: rooms.reduce((s,x)=>s+x.r.labourWorkshop,0)*1.1,
      materials: rooms.reduce((s,x)=>s+x.r.materials,0)*1.1,
      markup: (rooms.reduce((s,x)=>s+x.r.markup,0) + rooms.reduce((s,x)=>s+x.r.adjust,0))*1.1,
      overheads: rooms.reduce((s,x)=>s+x.r.overheads,0)*1.1,
    };
    const shareTotal = share.office+share.labour+share.materials+share.markup+share.overheads;

    const hours = {
      office: rooms.reduce((s,x)=>s+x.r.officeHours,0),
      factory: rooms.reduce((s,x)=>s+x.r.factoryHours,0),
      site: rooms.reduce((s,x)=>s+x.r.siteHours,0),
      travel: rooms.reduce((s,x)=>s+x.r.travelHours,0),
    };

    const bonus = computeBonus(jobIncGst, rooms.map(x=>x.r), catalogue);

    const warnings = [];
    rooms.forEach(x => { if (x.r.warnCogs) warnings.push({ severity:'red', roomId:x.room.id, roomName:x.room.name,
      message: 'Room profit too low in ' + x.room.name + '. Decrease cost of goods or increase markup.' }); });
    const jmax = (catalogue.warnings && catalogue.warnings.jobMaterialsRatioMax) != null ? catalogue.warnings.jobMaterialsRatioMax : 0.56;
    if (shareTotal > 0 && share.materials/shareTotal > jmax) {
      warnings.push({ severity:'amber', message:'Materials are too high a share of total job cost.' });
    }

    return { rooms, jobExGst, jobIncGst, share, shareTotal, hours, bonus, warnings };
  }

  return { cncPerSheet, itemRate, sectionTotal, sumQty, bucketTotal, overheadHourlyRate, computeRoom, computeBonus, computeQuote };
})();

/* ============================== reprice diff (pure) ============================== */
function diffCatalogues(oldCat, newCat, ctxQuote) {
  const changes = [];
  const quote = ctxQuote || { kmFromFactory: (newCat.travel && newCat.travel.defaultKmFromFactory) || 0 };
  oldCat.sections.forEach(oldSection => {
    const newSection = newCat.sections.find(s=>s.id===oldSection.id);
    oldSection.items.forEach(oldItem => {
      const oldRate = Calc.itemRate(oldItem, oldSection, oldCat, quote);
      if (!newSection) { changes.push({section:oldSection.title, item:oldItem.name, oldRate, newRate:null, removed:true}); return; }
      const newItem = newSection.items.find(i=>i.name===oldItem.name);
      if (!newItem) { changes.push({section:oldSection.title, item:oldItem.name, oldRate, newRate:null, removed:true}); return; }
      const newRate = Calc.itemRate(newItem, newSection, newCat, quote);
      if (Math.abs(oldRate-newRate) > 0.0001) changes.push({section:oldSection.title, item:oldItem.name, oldRate, newRate, delta:newRate-oldRate});
    });
  });
  return changes;
}

/* ============================== db.js ============================== */
const DB = (() => {
  const DB_NAME = 'joinery-quoter';
  const DB_VERSION = 1;
  let dbp = null;
  let memoryFallback = false;
  const memStore = { quotes: new Map(), catalogue: null, meta: new Map() };

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve) => {
      if (!window.indexedDB) { memoryFallback = true; resolve(null); return; }
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch(e) { memoryFallback = true; resolve(null); return; }
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('quotes')) db.createObjectStore('quotes', {keyPath:'id'});
        if (!db.objectStoreNames.contains('catalogue')) db.createObjectStore('catalogue');
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => { memoryFallback = true; resolve(null); };
      req.onblocked = () => { memoryFallback = true; resolve(null); };
    });
    return dbp;
  }

  async function tx(storeName, mode) {
    const db = await open();
    if (!db) return null;
    try { return db.transaction(storeName, mode).objectStore(storeName); } catch(e) { return null; }
  }

  async function getAllQuotes() {
    const store = await tx('quotes','readonly');
    if (!store) return Array.from(memStore.quotes.values());
    return new Promise((resolve)=>{
      const req = store.getAll();
      req.onsuccess = ()=>resolve(req.result||[]);
      req.onerror = ()=>resolve(Array.from(memStore.quotes.values()));
    });
  }

  async function putQuote(quote) {
    memStore.quotes.set(quote.id, quote);
    const store = await tx('quotes','readwrite');
    if (!store) return;
    return new Promise((resolve)=>{ const req = store.put(quote); req.onsuccess=()=>resolve(); req.onerror=()=>resolve(); });
  }

  async function deleteQuote(id) {
    memStore.quotes.delete(id);
    const store = await tx('quotes','readwrite');
    if (!store) return;
    return new Promise((resolve)=>{ const req = store.delete(id); req.onsuccess=()=>resolve(); req.onerror=()=>resolve(); });
  }

  async function getCatalogue() {
    const store = await tx('catalogue','readonly');
    if (!store) return memStore.catalogue;
    return new Promise((resolve)=>{ const req = store.get('current'); req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>resolve(null); });
  }

  async function putCatalogue(cat) {
    memStore.catalogue = cat;
    const store = await tx('catalogue','readwrite');
    if (!store) return;
    return new Promise((resolve)=>{ const req = store.put(cat,'current'); req.onsuccess=()=>resolve(); req.onerror=()=>resolve(); });
  }

  async function getMeta(key) {
    const store = await tx('meta','readonly');
    if (!store) return memStore.meta.get(key);
    return new Promise((resolve)=>{ const req = store.get(key); req.onsuccess=()=>resolve(req.result); req.onerror=()=>resolve(memStore.meta.get(key)); });
  }

  async function setMeta(key, val) {
    memStore.meta.set(key, val);
    const store = await tx('meta','readwrite');
    if (!store) return;
    return new Promise((resolve)=>{ const req = store.put(val, key); req.onsuccess=()=>resolve(); req.onerror=()=>resolve(); });
  }

  return { open, getAllQuotes, putQuote, deleteQuote, getCatalogue, putCatalogue, getMeta, setMeta, isMemoryFallback: ()=>memoryFallback };
})();

/* ============================== stats.js ============================== */
const Stats = (() => {
  function median(arr) {
    if (!arr || !arr.length) return null;
    const s = [...arr].sort((a,b)=>a-b);
    const mid = Math.floor(s.length/2);
    return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  }
  function percentile(arr, p) {
    if (!arr || !arr.length) return null;
    const s = [...arr].sort((a,b)=>a-b);
    const idx = clamp(Math.round((p/100)*(s.length-1)),0,s.length-1);
    return s[idx];
  }
  function mean(arr) { return (arr && arr.length) ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
  function monthKey(dateStr) { const d = new Date(dateStr); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

  function filterQuotes(quotes, filter) {
    filter = filter || {};
    return quotes.filter(q => {
      if (filter.client && q.client !== filter.client) return false;
      if (filter.tier && q.clientTier !== filter.tier) return false;
      if (filter.status && q.status !== filter.status) return false;
      if (filter.dateFrom && new Date(q.createdAt) < new Date(filter.dateFrom)) return false;
      if (filter.dateTo && new Date(q.createdAt) > new Date(filter.dateTo)) return false;
      return true;
    });
  }

  function pipeline(quotes, resultsById, filter) {
    const inRange = filterQuotes(quotes, filter);
    const n = inRange.length;
    const totalIncGst = inRange.reduce((s,q)=>s+resultsById[q.id].jobIncGst,0);
    const won = inRange.filter(q=>q.status==='won');
    const decided = inRange.filter(q=>q.status==='won'||q.status==='lost');
    const wonValue = won.reduce((s,q)=>s+resultsById[q.id].jobIncGst,0);
    const winRate = decided.length ? won.length/decided.length : null;
    const daysToDecision = decided.filter(q=>q.sentAt&&q.decidedAt).map(q=>(new Date(q.decidedAt)-new Date(q.sentAt))/86400000);
    const values = inRange.map(q=>resultsById[q.id].jobIncGst);
    return { n, totalIncGst, wonValue, winCount: won.length, decidedCount: decided.length,
      winRate, medianDaysToDecision: median(daysToDecision), avgValue: mean(values), medianValue: median(values) };
  }

  function priceTrendByRoomType(quotes, resultsById, filter, includeDrafts) {
    const inRange = filterQuotes(quotes, filter).filter(q=>includeDrafts || q.status!=='draft');
    const byRoomMonth = {};
    inRange.forEach(q=>{
      const res = resultsById[q.id];
      res.rooms.forEach(x=>{
        const type = x.room.name || 'Room';
        const m = monthKey(q.createdAt);
        byRoomMonth[type] = byRoomMonth[type]||{};
        byRoomMonth[type][m] = byRoomMonth[type][m]||[];
        if (x.r.incGst > 0.005) byRoomMonth[type][m].push(x.r.incGst);
      });
    });
    const series = {};
    for (const type in byRoomMonth) {
      const months = Object.keys(byRoomMonth[type]).sort();
      const pts = months.map(m => ({ month:m, n:byRoomMonth[type][m].length, median: median(byRoomMonth[type][m]) })).filter(pt=>pt.n>=3);
      if (pts.length) series[type] = pts;
    }
    return series;
  }

  function rateDrift(quotes, catalogue) {
    const seen = {};
    const sorted = [...quotes].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    sorted.forEach(q=>{
      const cat = q.catalogueSnapshot;
      if (!cat) return;
      cat.sections.forEach(section=>{
        section.items.forEach(item=>{
          const rate = Calc.itemRate(item, section, cat, q);
          const key = section.id+'::'+item.name;
          if (!seen[key]) seen[key] = { section: section.title, sectionId: section.id, item: item.name, firstRate: rate, firstDate: q.createdAt };
        });
      });
    });
    const rows = [];
    for (const key in seen) {
      const s = seen[key];
      let currentRate = null;
      const curSection = catalogue.sections.find(sec=>sec.id===s.sectionId);
      if (curSection) {
        const curItem = curSection.items.find(i=>i.name===s.item);
        if (curItem) currentRate = Calc.itemRate(curItem, curSection, catalogue, {kmFromFactory:(catalogue.travel&&catalogue.travel.defaultKmFromFactory)||0});
      }
      const deltaPct = (currentRate!=null && s.firstRate) ? (currentRate-s.firstRate)/s.firstRate : null;
      rows.push({ section:s.section, item:s.item, firstRate:s.firstRate, firstDate:s.firstDate, currentRate, deltaPct });
    }
    rows.sort((a,b)=>(b.deltaPct==null?-999:b.deltaPct)-(a.deltaPct==null?-999:a.deltaPct));
    return rows;
  }

  function costMixDrift(quotes, resultsById, filter) {
    const inRange = filterQuotes(quotes, filter);
    const byQuarter = {};
    inRange.forEach(q=>{
      const d = new Date(q.createdAt);
      const qtr = d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1);
      byQuarter[qtr] = byQuarter[qtr] || {office:0,labour:0,materials:0,markup:0,overheads:0,total:0};
      const res = resultsById[q.id];
      byQuarter[qtr].office += res.share.office;
      byQuarter[qtr].labour += res.share.labour;
      byQuarter[qtr].materials += res.share.materials;
      byQuarter[qtr].markup += res.share.markup;
      byQuarter[qtr].overheads += res.share.overheads;
      byQuarter[qtr].total += res.shareTotal;
    });
    return Object.keys(byQuarter).sort().map(qtr=>{
      const b = byQuarter[qtr]; const t = b.total || 1;
      return { quarter:qtr, office:b.office/t, labour:b.labour/t, materials:b.materials/t, markup:b.markup/t, overheads:b.overheads/t };
    });
  }

  function marginHealth(quotes, resultsById, filter) {
    const inRange = filterQuotes(quotes, filter);
    const ratios = []; const overThreshold = [];
    inRange.forEach(q=>{
      const res = resultsById[q.id];
      res.rooms.forEach(x=>{
        if (x.r.incGst > 0.005) {
          ratios.push(x.r.cogsRatio);
          if (x.r.warnCogs) overThreshold.push({ quoteId:q.id, jobName:q.jobName, room:x.room.name, cogsRatio:x.r.cogsRatio });
        }
      });
    });
    return { ratios, overThreshold };
  }

  function benchmark(quotes, resultsById, roomType, jobSize, includeDrafts) {
    const prices = [];
    quotes.forEach(q=>{
      if (!includeDrafts && q.status==='draft') return;
      const res = resultsById[q.id];
      res.rooms.forEach(x=>{
        if (x.room.name===roomType && (!jobSize || (x.room.spec && x.room.spec.jobSize)===jobSize) && x.r.incGst>0.005) prices.push(x.r.incGst);
      });
    });
    return { n: prices.length, median: median(prices), p25: percentile(prices,25), p75: percentile(prices,75) };
  }

  function clientTierMix(quotes, resultsById, filter) {
    const inRange = filterQuotes(quotes, filter);
    const byClient = {};
    inRange.forEach(q=>{
      const key = q.client || '—';
      byClient[key] = byClient[key] || {value:0,won:0,decided:0};
      byClient[key].value += resultsById[q.id].jobIncGst;
      if (q.status==='won') byClient[key].won++;
      if (q.status==='won'||q.status==='lost') byClient[key].decided++;
    });
    return byClient;
  }

  function discounting(quotes, resultsById, filter) {
    const inRange = filterQuotes(quotes, filter);
    const buckets = { list:{label:'List price',n:0,won:0,decided:0}, small:{label:'0–10% off',n:0,won:0,decided:0}, big:{label:'>10% off',n:0,won:0,decided:0} };
    inRange.forEach(q=>{
      const res = resultsById[q.id];
      const avgAdjust = res.rooms.length ? res.rooms.reduce((s,x)=>s+(x.room.adjust||0),0)/res.rooms.length : 0;
      const bucket = avgAdjust>=0 ? 'list' : (avgAdjust>=-0.1 ? 'small' : 'big');
      buckets[bucket].n++;
      if (q.status==='won') buckets[bucket].won++;
      if (q.status==='won'||q.status==='lost') buckets[bucket].decided++;
    });
    return buckets;
  }

  return { median, percentile, mean, monthKey, filterQuotes, pipeline, priceTrendByRoomType, rateDrift, costMixDrift, marginHealth, benchmark, clientTierMix, discounting };
})();

/* ============================== charts.js ============================== */
const Charts = (() => {
  function sparkline(opts) {
    const series = opts.series||[]; const width = opts.width||90; const height = opts.height||24; const color = opts.color||'var(--accent)';
    if (!series.length) return '<svg width="'+width+'" height="'+height+'"></svg>';
    const min = Math.min.apply(null, series), max = Math.max.apply(null, series);
    const range = (max-min)||1;
    const step = width/((series.length-1)||1);
    const pts = series.map((v,i)=> (i*step).toFixed(1)+','+(height-((v-min)/range)*height).toFixed(1)).join(' ');
    return '<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="none">'
      +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5"/></svg>';
  }

  function lineChart(opts) {
    const seriesMap = opts.seriesMap||{}; const width = opts.width||640; const height = opts.height||260;
    const yFormat = opts.yFormat || (v=>v.toFixed(0));
    const colors = opts.colors || ['#4a9eff','#7ee0a8','#e0a33e','#e05c5c','#9b7ee0','#4ad6c9','#f2a5d0','#a3d977'];
    const pad = {l:56,r:16,t:16,b:32};
    const allX = new Set();
    for (const k in seriesMap) seriesMap[k].forEach(p=>allX.add(p.x));
    const xLabels = Array.from(allX).sort();
    if (!xLabels.length) return '<svg width="'+width+'" height="'+height+'"></svg>';
    const allY = [];
    for (const k in seriesMap) seriesMap[k].forEach(p=>allY.push(p.y));
    const yMax = Math.max.apply(null, allY.concat([1])) * 1.15;
    const innerW = width-pad.l-pad.r, innerH = height-pad.t-pad.b;
    const xPos = x => pad.l + (xLabels.indexOf(x)/(Math.max(xLabels.length-1,1))) * innerW;
    const yPos = y => pad.t + innerH - (y/yMax)*innerH;

    let svg = '<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">';
    for (let i=0;i<=4;i++){ const y = pad.t + innerH*(i/4);
      svg += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(width-pad.r)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
      svg += '<text x="'+(pad.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--text-dim)">'+yFormat(yMax-(yMax*i/4))+'</text>';
    }
    const everyN = Math.max(1, Math.ceil(xLabels.length/8));
    xLabels.forEach((x,i)=>{ if (i%everyN===0) svg += '<text x="'+xPos(x).toFixed(1)+'" y="'+(height-8)+'" text-anchor="middle" font-size="10" fill="var(--text-dim)">'+x+'</text>'; });
    let ci=0;
    for (const name in seriesMap) {
      const pts = seriesMap[name]; const color = colors[ci++ % colors.length];
      const path = pts.map((p,i)=> (i===0?'M':'L')+xPos(p.x).toFixed(1)+','+yPos(p.y).toFixed(1)).join(' ');
      svg += '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
      pts.forEach(p=> svg += '<circle cx="'+xPos(p.x).toFixed(1)+'" cy="'+yPos(p.y).toFixed(1)+'" r="3" fill="'+color+'"><title>'+x_(name)+' '+p.x+': '+yFormat(p.y)+' (n='+p.n+')</title></circle>');
    }
    svg += '</svg>';
    return svg;
    function x_(n){ return n; }
  }

  function barChart(opts) {
    const data = opts.data||[]; const width = opts.width||640; const height = opts.height||220;
    const color = opts.color||'var(--accent)';
    const pad = {l:48,r:16,t:16,b:32};
    const innerW = width-pad.l-pad.r, innerH = height-pad.t-pad.b;
    if (!data.length) return '<svg width="'+width+'" height="'+height+'"></svg>';
    const yMax = Math.max.apply(null, data.map(d=>d.value).concat([1]))*1.15;
    const slot = innerW/data.length; const bw = slot*0.6;
    let svg = '<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">';
    data.forEach((d,i)=>{
      const x = pad.l + i*slot + (slot-bw)/2;
      const h = (d.value/yMax)*innerH; const y = pad.t+innerH-h;
      svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+color+'" rx="2"/>';
      svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(height-8)+'" text-anchor="middle" font-size="10" fill="var(--text-dim)">'+d.label+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function stackedBar(opts) {
    const data = opts.data||[]; const keys = opts.keys||[]; const colors = opts.colors||[];
    const width = opts.width||640; const height = opts.height||260;
    const pad = {l:48,r:16,t:16,b:32};
    const innerW = width-pad.l-pad.r, innerH = height-pad.t-pad.b;
    if (!data.length) return '<svg width="'+width+'" height="'+height+'"></svg>';
    const slot = innerW/data.length; const bw = slot*0.6;
    let svg = '<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">';
    for (let i=0;i<=4;i++){ const y=pad.t+innerH*(i/4);
      svg += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(width-pad.r)+'" y2="'+y+'" stroke="var(--border)"/>';
      svg += '<text x="'+(pad.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--text-dim)">'+(100-i*25)+'%</text>';
    }
    data.forEach((d,i)=>{
      const x = pad.l + i*slot + (slot-bw)/2;
      let yCursor = pad.t+innerH;
      keys.forEach((k,ki)=>{
        const v = d[k]||0; const h = v*innerH; yCursor -= h;
        svg += '<rect x="'+x.toFixed(1)+'" y="'+yCursor.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+colors[ki]+'"><title>'+k+': '+(v*100).toFixed(1)+'%</title></rect>';
      });
      svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(height-8)+'" text-anchor="middle" font-size="10" fill="var(--text-dim)">'+d.label+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function histogram(opts) {
    const values = opts.values||[]; const buckets = opts.buckets||10;
    const width = opts.width||480; const height = opts.height||200;
    const threshold = opts.threshold; const xFormat = opts.xFormat || (v=>v.toFixed(2));
    if (!values.length) return '<svg width="'+width+'" height="'+height+'"></svg>';
    const min = Math.min.apply(null, values), max = Math.max.apply(null, values.concat([min+0.0001]));
    const bw = (max-min)/buckets || 1;
    const counts = new Array(buckets).fill(0);
    values.forEach(v=>{ let idx = Math.floor((v-min)/bw); if (idx>=buckets) idx=buckets-1; if (idx<0) idx=0; counts[idx]++; });
    const pad = {l:32,r:16,t:16,b:28};
    const innerW = width-pad.l-pad.r, innerH = height-pad.t-pad.b;
    const yMax = Math.max.apply(null, counts.concat([1]));
    const slot = innerW/buckets;
    let svg = '<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">';
    counts.forEach((c,i)=>{
      const h = (c/yMax)*innerH; const x = pad.l+i*slot; const y = pad.t+innerH-h;
      svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(slot*0.9).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="var(--accent)"><title>'+c+' rooms</title></rect>';
    });
    if (threshold!=null && threshold>=min && threshold<=max) {
      const tx = pad.l + ((threshold-min)/(max-min))*innerW;
      svg += '<line x1="'+tx.toFixed(1)+'" y1="'+pad.t+'" x2="'+tx.toFixed(1)+'" y2="'+(pad.t+innerH)+'" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    }
    svg += '<text x="'+pad.l+'" y="'+(height-8)+'" font-size="10" fill="var(--text-dim)">'+xFormat(min)+'</text>';
    svg += '<text x="'+(width-pad.r)+'" y="'+(height-8)+'" text-anchor="end" font-size="10" fill="var(--text-dim)">'+xFormat(max)+'</text>';
    svg += '</svg>';
    return svg;
  }

  return { sparkline, lineChart, barChart, stackedBar, histogram };
})();

const State = {
  catalogue: null,
  quotes: [],
  resultsCache: {},
  currentQuoteId: null,
  route: 'dashboard',
  settingsTab: 'company',
  editorTab: 'rooms',
  dashboardFilter: { client:'', tier:'', status:'', dateFrom:'', dateTo:'', includeDrafts:false },
  saveIndicator: '',
  modal: null,
  toast: null,
  wizardStep: 0,
  wizardDraft: null,
  benchmarkPick: { roomType:'', jobSize:'' },
  dismissedChecklist: false,
  everSavedToFile: false,
  everExportedPdf: false,
  collapsedSections: {},
};

function getCurrentQuote() { return State.quotes.find(q=>q.id===State.currentQuoteId); }
function currentCatalogueForQuote(quote) { return (quote && quote.catalogueSnapshot) || State.catalogue; }
function getResult(quote) {
  const cat = currentCatalogueForQuote(quote);
  const cacheKey = quote.id + '::' + quote.updatedAt;
  const cached = State.resultsCache[quote.id];
  if (cached && cached.key === cacheKey) return cached.result;
  const result = Calc.computeQuote(quote, cat);
  State.resultsCache[quote.id] = { key: cacheKey, result };
  return result;
}

function newQuote() {
  const now = new Date().toISOString();
  return {
    schemaVersion: 1, id: uid(), jobName: 'New quote', client: '',
    clientTier: State.catalogue.defaultClientTier || 'T2', revision: 1, status: 'draft',
    createdAt: now, updatedAt: now, sentAt: null, decidedAt: null,
    kmFromFactory: (State.catalogue.travel && State.catalogue.travel.defaultKmFromFactory) || 25,
    notes: '', rooms: [], options: [], catalogueSnapshot: null, catalogueVersion: State.catalogue.catalogueVersion,
  };
}
function newRoom(name) {
  return { id: uid(), name: name||'Room', spec:{doorsPanels:'',benchtop:'',jobSize:'',jobType:''}, adjust:0, qty:{} };
}

async function saveCurrentQuote(bumpRevision) {
  const q = getCurrentQuote();
  if (!q) return;
  if (!q.catalogueSnapshot) { q.catalogueSnapshot = deepClone(State.catalogue); q.catalogueVersion = State.catalogue.catalogueVersion; }
  if (bumpRevision) q.revision = (q.revision||1) + 1;
  q.updatedAt = new Date().toISOString();
  await DB.putQuote(q);
  const idx = State.quotes.findIndex(x=>x.id===q.id);
  if (idx>=0) State.quotes[idx]=q; else State.quotes.push(q);
  State.saveIndicator = 'Saved ' + new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  const ind = byId('save-indicator');
  if (ind) ind.textContent = State.saveIndicator;
}

let autosaveTimer = null;
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{ saveCurrentQuote(); }, 800);
}

function touchQuote(quote) { quote.updatedAt = new Date().toISOString(); }

/* ============================== app bootstrap & render ============================== */
async function initApp() {
  const seedText = byId('seed-catalogue').textContent;
  SEED_CATALOGUE = Object.freeze(JSON.parse(seedText));
  await DB.open();
  let cat = await DB.getCatalogue();
  if (!cat) { cat = deepClone(SEED_CATALOGUE); await DB.putCatalogue(cat); }
  State.catalogue = cat;
  State.quotes = await DB.getAllQuotes();
  const firstRun = await DB.getMeta('firstRunComplete');
  const savedFilter = await DB.getMeta('dashboardFilter');
  if (savedFilter) State.dashboardFilter = savedFilter;
  State.everSavedToFile = !!(await DB.getMeta('everSavedToFile'));
  State.everExportedPdf = !!(await DB.getMeta('everExportedPdf'));
  State.dismissedChecklist = !!(await DB.getMeta('dismissedChecklist'));
  if (!firstRun) { State.route = 'wizard'; State.wizardDraft = deepClone(State.catalogue); State.wizardStep = 0; }
  render();
  document.addEventListener('keydown', onGlobalKeydown);
}

function onGlobalKeydown(e) {
  if (State.modal) {
    if (e.key === 'Escape') { State.modal = null; render(); }
    return;
  }
}

function render() {
  const app = byId('app');
  app.innerHTML = renderNav() + renderView() + renderModal() + renderToast();
  bindGlobalEvents();
  document.querySelectorAll('[data-autofocus]').forEach(el=>el.focus());
  if (State.modalKind === 'computed-option') refreshComputedOptionSelects();
}

function bindGlobalEvents() {
  const app = byId('app');
  app.onclick = onAppClick;
  app.oninput = onAppInput;
  app.onchange = onAppChange;
}

function go(route, extra) {
  State.route = route;
  if (extra) Object.assign(State, extra);
  render();
}

function toast(msg) {
  State.toast = msg;
  render();
  setTimeout(()=>{ if (State.toast===msg) { State.toast=null; const t=byId('toast-el'); if (t) t.remove(); } }, 3200);
}

function renderToast() {
  if (!State.toast) return '';
  return '<div class="toast" id="toast-el">'+escapeHtml(State.toast)+'</div>';
}

function renderNav() {
  if (State.route === 'wizard') return '';
  const tabs = [['dashboard','Dashboard'],['quotes','Quotes'],['settings','Settings']];
  return '<div class="nav">'
    +'<div class="nav-brand">Joinery Quoter</div>'
    +'<div class="nav-tabs">'+tabs.map(t=>'<button class="nav-tab '+(State.route===t[0]||(State.route==='editor'&&t[0]==='quotes')?'active':'')+'" data-act="nav" data-route="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'
    +'<div class="nav-right">'
      +(DB.isMemoryFallback() ? '<span class="chip warn">No browser storage — use Save to file</span>' : '')
      +'<span class="dim small" id="save-indicator">'+escapeHtml(State.saveIndicator)+'</span>'
      +'<button class="ghost small" data-act="run-tests">Self-tests</button>'
    +'</div></div>';
}

function renderView() {
  switch (State.route) {
    case 'wizard': return renderWizard();
    case 'dashboard': return renderDashboard();
    case 'quotes': return renderQuoteList();
    case 'editor': return renderEditor();
    case 'settings': return renderSettings();
    case 'tests': return renderTests();
    default: return renderDashboard();
  }
}

function renderModal() {
  if (!State.modal) return '';
  return State.modal();
}

/* ============================== event dispatch ============================== */
function resolveRoot(rootName) {
  if (rootName === 'quote') return getCurrentQuote();
  if (rootName === 'catalogue') return State.catalogue;
  if (rootName === 'wizard') return State.wizardDraft;
  if (rootName === 'filter') return State.dashboardFilter;
  return null;
}

function onAppInput(e) {
  const el = e.target;
  if (el.dataset.role === 'qty') {
    const roomId = el.dataset.room, sectionId = el.dataset.section, itemName = el.dataset.item;
    const quote = getCurrentQuote();
    const room = quote.rooms.find(r=>r.id===roomId);
    const v = el.value.trim()==='' ? null : parseFloat(el.value);
    room.qty[sectionId] = room.qty[sectionId] || {};
    if (v==null || isNaN(v)) delete room.qty[sectionId][itemName]; else room.qty[sectionId][itemName] = v;
    touchQuote(quote);
    patchRoomComputed(roomId);
    scheduleAutosave();
    return;
  }
  if (el.dataset.act === 'quote-km') {
    const quote = getCurrentQuote();
    quote.kmFromFactory = el.value==='' ? 0 : parseFloat(el.value);
    touchQuote(quote);
    patchQuoteHeaderComputed();
    scheduleAutosave();
    return;
  }
  if (el.dataset.bind && el.dataset.root) {
    const root = resolveRoot(el.dataset.root);
    if (!root) return;
    let value = el.type==='number' ? (el.value===''?null:parseFloat(el.value)) : el.value;
    setPath(root, el.dataset.bind, value);
    if (el.dataset.root==='quote') { touchQuote(root); if (el.dataset.recompute==='1') patchQuoteHeaderComputed(); scheduleAutosave(); }
    if (el.dataset.root==='catalogue') { DB.putCatalogue(State.catalogue); patchSettingsExamples(el); }
    if (el.dataset.root==='filter') { DB.setMeta('dashboardFilter', State.dashboardFilter); }
  }
}

function applyTierFieldEdit(el) {
  const idx = Number(el.dataset.idx), f = el.dataset.f;
  const tier = State.catalogue.clientTiers[idx];
  if (!tier) return;
  tier[f] = f==='materialMarkup' ? (parseFloat(el.value)||0) : el.value;
  DB.putCatalogue(State.catalogue);
}
function applyCatItemFieldEdit(el) {
  const sectionId = el.dataset.section, idx = Number(el.dataset.idx), f = el.dataset.f;
  const section = State.catalogue.sections.find(s=>s.id===sectionId);
  if (!section) return;
  const item = section.items[idx];
  if (!item) return;
  const numericFields = ['boardCost','edgeCost100m','perKm','rate'];
  item[f] = numericFields.includes(f) ? (parseFloat(el.value)||0) : el.value;
  DB.putCatalogue(State.catalogue);
}
function applyDropdownFieldEdit(el) {
  const list = el.dataset.list, idx = Number(el.dataset.idx);
  State.catalogue.dropdowns[list][idx] = el.value;
  DB.putCatalogue(State.catalogue);
}

function onAppChange(e) {
  const el = e.target;
  if (el.id === 'file-input' && el.files && el.files[0]) { importQuoteFile(el.files[0]); return; }
  if (el.id === 'catalogue-file-input' && el.files && el.files[0]) { importCatalogueFile(el.files[0]); return; }
  if (el.id === 'co-room' || el.id === 'co-section') { refreshComputedOptionSelects(); return; }
  if (el.dataset.role === 'tier-field') { applyTierFieldEdit(el); render(); return; }
  if (el.dataset.role === 'cat-item-field') { applyCatItemFieldEdit(el); render(); return; }
  if (el.dataset.role === 'dropdown-field') { applyDropdownFieldEdit(el); render(); return; }
  if (el.dataset.bind && el.dataset.root && el.tagName==='SELECT') {
    const root = resolveRoot(el.dataset.root);
    if (!root) return;
    setPath(root, el.dataset.bind, el.value);
    if (el.dataset.root==='quote') { touchQuote(root); render(); scheduleAutosave(); }
    if (el.dataset.root==='catalogue') { DB.putCatalogue(State.catalogue); render(); }
    if (el.dataset.root==='filter') { DB.setMeta('dashboardFilter', State.dashboardFilter); render(); }
    return;
  }
  if (el.dataset.act && Actions[el.dataset.act]) { Actions[el.dataset.act](el, e); }
}

/* Only patches the edited field's own worked-example text, so typing in a registry
   input never loses focus. Other fields' examples catch up on the next full render. */
function patchSettingsExamples(el) {
  if (!el || !el.dataset.bind) return;
  const f = Registry.fields.find(f=>f.key===el.dataset.bind);
  if (!f) return;
  const detailId = 'detail-'+f.key.replace(/[^a-zA-Z0-9]/g,'');
  const detailEl = byId(detailId);
  if (!detailEl) return;
  const exEl = detailEl.querySelector('.fr-example');
  if (exEl) { try { exEl.textContent = f.example(State.catalogue); } catch(err) {} }
}

async function onAppClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = Actions[el.dataset.act];
  if (fn) await fn(el, e);
}

function allResultsById() {

}

function renderPriceTrendPanel(trend) {
  const types = Object.keys(trend);
  const head = '<div class="panel-head"><h2>Price trend by room type</h2><span class="panel-filter-note">Median inc-GST price, by month. Months with fewer than 3 rooms are omitted.</span></div>';
  if (!types.length) return '<div class="panel"><div class="panel-head"><h2>Price trend by room type</h2></div><div class="suppressed">Not enough data yet — trends need at least 3 rooms of the same type in the same month.</div></div>';
  const seriesMap = {}; types.forEach(t=>{ seriesMap[t] = trend[t].map(p=>({x:p.month, y:p.median, n:p.n})); });
  const colors = ['#4a9eff','#7ee0a8','#e0a33e','#e05c5c','#9b7ee0','#4ad6c9','#f2a5d0','#a3d977'];
  const chart = Charts.lineChart({ seriesMap, yFormat: v=>fmtMoney0(v) });
  const legend = types.map((t,i)=>'<span class="item"><span class="swatch" style="background:'+colors[i%colors.length]+'"></span>'+escapeHtml(t)+'</span>').join('');
  const rows = types.map(t=>{
    const pts = trend[t]; const last = pts[pts.length-1]; const yearAgo = pts.find(p=>{
      const d0=new Date(last.month+'-01'), d1=new Date(p.month+'-01'); return (d0-d1)/(1000*60*60*24*30) >= 11.5;
    });
    const chg = yearAgo ? ((last.median-yearAgo.median)/yearAgo.median) : null;
    const vals = pts.map(p=>p.median);
    return '<tr><td>'+escapeHtml(t)+'</td><td class="num">'+pts.reduce((s,p)=>s+p.n,0)+'</td><td class="num">'+fmtMoney0(last.median)+'</td>'
      +'<td class="num">'+fmtMoney0(Stats.percentile(vals,25))+' – '+fmtMoney0(Stats.percentile(vals,75))+'</td>'
      +'<td class="num">'+(chg!=null?fmtPct(chg,0):'—')+'</td></tr>';
  }).join('');
  return '<div class="panel"><div class="card">'+head+chart+'<div class="legend">'+legend+'</div>'
    +'<table style="margin-top:14px;"><thead><tr><th>Room type</th><th class="num">Quotes</th><th class="num">Latest median</th><th class="num">p25–p75</th><th class="num">12-mo change</th></tr></thead><tbody>'+rows+'</tbody></table>'

function renderClientMixPanel(clientMix) {

function renderDiscountingPanel(disc) {
  const rows = ['list','small','big'].map(k=>{

    return '<tr><td>'+b.label+'</td><td class="num">'+b.n+'</td><td class="num">'+wr+' <span class="dim small">(n='+b.decided+')</span></td></tr>';

function renderDashboard() {
  const quotes = State.quotes;
  const resultsById = allResultsById();
  const filter = State.dashboardFilter;
  const pipe = Stats.pipeline(quotes, resultsById, filter);
  let body = renderGettingStarted() + renderFilterBar(filter) + renderPipelineStrip(pipe);
  if (quotes.length < 3) {
    body += '<div class="panel"><div class="card" style="text-align:center; padding:36px;">'
      +'<h2>Trends need history</h2><p class="dim">Once you have a few saved quotes, this page fills in with price trends by room type, rate drift, cost-mix, margin health and more — all built from your own quotes, never anyone else\'s.</p>'
      +'<button class="primary" data-act="new-quote">New quote</button></div></div>';
    return '<div class="view dashboard">'+body+'</div>';
  }
  const trend = Stats.priceTrendByRoomType(quotes, resultsById, filter, filter.includeDrafts);
  const drift = Stats.rateDrift(quotes, State.catalogue);
  const mix = Stats.costMixDrift(quotes, resultsById, filter);
  const margin = Stats.marginHealth(quotes, resultsById, filter);
  const clientMix = Stats.clientTierMix(quotes, resultsById, filter);
  const disc = Stats.discounting(quotes, resultsById, filter);
  body += renderPriceTrendPanel(trend) + renderRateDriftPanel(drift) + renderCostMixPanel(mix) + renderMarginPanel(margin)
    + renderBenchmarkPanel(quotes, resultsById) + renderClientMixPanel(clientMix) + renderDiscountingPanel(disc);
  return '<div class="view dashboard">'+body+'</div>';
}

function renderSectionBlock(quote, room, section) {
  const catalogue = currentCatalogueForQuote(quote);
  const qtyMap = room.qty[section.id] || {};
  const presentNames = Object.keys(qtyMap);
  const itemsByName = {}; section.items.forEach(i=>itemsByName[i.name]=i);
  const rows = presentNames.filter(n=>itemsByName[n]).map(name=>{
    const item = itemsByName[name];
    const rate = Calc.itemRate(item, section, catalogue, quote);
    const q = qtyMap[name];
    const lineTotal = (q||0) * rate;
    return '<div class="item-row">'
      +'<div class="item-name">'+escapeHtml(name)+'</div>'
      +'<div><input type="number" step="any" value="'+(q!=null?q:'')+'" data-role="qty" data-room="'+room.id+'" data-section="'+section.id+'" data-item="'+escapeHtml(name)+'"></div>'
      +'<div class="dim small">'+section.unitLabel+'</div>'
      +'<div class="item-rate" title="rate: '+fmtMoney(rate)+' / '+section.unitLabel+'">'+fmtMoney(rate)+'</div>'
      +'<div id="'+lineTotalId(room.id,section.id,name)+'" class="num money small">'+(q?fmtMoney(lineTotal):'')+'</div>'
      +'<button class="ghost small" data-act="remove-item" data-room="'+room.id+'" data-section="'+section.id+'" data-item="'+escapeHtml(name)+'" title="Remove">×</button>'
      +'</div>';
  }).join('');
  const available = section.items.filter(i=>!presentNames.includes(i.name));
  const addPicker = available.length ? '<div class="add-item-row"><select data-act="add-item" data-room="'+room.id+'" data-section="'+section.id+'"><option value="">+ add item…</option>'
      +available.map(i=>'<option value="'+escapeHtml(i.name)+'">'+escapeHtml(i.name)+'</option>').join('')+'</select></div>' : '';
  return '<div class="section-block">'
    +'<div class="section-title-row"><span class="st-title">'+escapeHtml(section.title)+'</span><span class="st-total money" id="'+sectionSubtotalId(room.id,section.id)+'">'+fmtMoney(Calc.sectionTotal(room,section,catalogue,quote))+'</span></div>'
    +rows+addPicker
    +'</div>';
}

  }

  return '<div class="room-footer" id="room-footer-'+room.id+'">'

function patchRoomComputed(roomId) {
  const quote = getCurrentQuote();
  const catalogue = currentCatalogueForQuote(quote);
  const room = quote.rooms.find(r=>r.id===roomId);
  if (!room) return;
  catalogue.sections.forEach(section=>{
    const qtyMap = room.qty[section.id]||{};
    section.items.forEach(item=>{
      const cell = byId(lineTotalId(roomId, section.id, item.name));
      if (cell) {
        const q = qtyMap[item.name];
        const rate = Calc.itemRate(item, section, catalogue, quote);
        cell.textContent = q ? fmtMoney(q*rate) : '';
      }
    });
    const subtotalEl = byId(sectionSubtotalId(roomId, section.id));
    if (subtotalEl) subtotalEl.textContent = fmtMoney(Calc.sectionTotal(room, section, catalogue, quote));
  });
  const result = Calc.computeQuote(quote, catalogue);
  const roomResult = result.rooms.find(x=>x.room.id===roomId);
  const footerEl = byId('room-footer-'+roomId);
  if (footerEl) footerEl.outerHTML = renderRoomFooter(quote, room, roomResult.r);
  const headEl = document.querySelector('#room-'+roomId+' .room-card-head .money');
  if (headEl) headEl.textContent = fmtMoney(roomResult.r.incGst);
  const summaryEl = byId('job-summary-panel');
  if (summaryEl) summaryEl.outerHTML = renderJobSummaryPanel(quote, result);
  const headerTotal = byId('header-total');
  if (headerTotal) headerTotal.textContent = fmtMoney(result.jobIncGst);
}

function patchQuoteHeaderComputed() {
  const quote = getCurrentQuote();
  const catalogue = currentCatalogueForQuote(quote);
  const result = Calc.computeQuote(quote, catalogue);
  const headerTotal = byId('header-total');
  if (headerTotal) headerTotal.textContent = fmtMoney(result.jobIncGst);
  const summaryEl = byId('job-summary-panel');
  if (summaryEl) summaryEl.outerHTML = renderJobSummaryPanel(quote, result);
  quote.rooms.forEach(room => {
    const roomResult = result.rooms.find(x=>x.room.id===room.id);
    const footerEl = byId('room-footer-'+room.id);
    if (footerEl && roomResult) footerEl.outerHTML = renderRoomFooter(quote, room, roomResult.r);
  });
}

      +'<div class="stack">'+renderWarningsBanner(result)+roomsHtml+'<button data-act="add-room">+ Add room</button></div>'
      +renderJobSummaryPanel(quote, result)
      +'</div>';
  }
  return header + body;
}

/* ============================== re-price modal ============================== */
function renderRepriceModal(quote) {
  const diff = diffCatalogues(quote.catalogueSnapshot, State.catalogue, quote);
  return function() {
    if (!diff.length) {
      return '<div class="modal-backdrop"><div class="modal"><h2>Re-price at current rates</h2>'
        +'<p>No rates have changed since this quote was last priced. Nothing to update.</p>'
        +'<div class="row" style="justify-content:flex-end;"><button data-act="close-modal">Close</button></div></div></div>';
    }
    const rows = diff.map(d=>'<tr><td>'+escapeHtml(d.section)+'</td><td>'+escapeHtml(d.item)+'</td>'
      +'<td class="num">'+fmtMoney(d.oldRate)+'</td><td class="num">'+(d.removed?'<span class="chip warn">removed</span>':fmtMoney(d.newRate))+'</td></tr>').join('');
    const oldTotal = Calc.computeQuote(quote, quote.catalogueSnapshot).jobIncGst;
    const newTotal = Calc.computeQuote(quote, State.catalogue).jobIncGst;
    return '<div class="modal-backdrop"><div class="modal">'
      +'<h2>Re-price at current rates</h2>'
      +'<p class="dim small">'+diff.length+' rate(s) changed since this quote was priced.</p>'
      +'<table><thead><tr><th>Section</th><th>Item</th><th class="num">Old</th><th class="num">New</th></tr></thead><tbody>'+rows+'</tbody></table>'
      +'<div class="row between" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">'
        +'<span>Total: '+fmtMoney(oldTotal)+' → <strong class="money">'+fmtMoney(newTotal)+'</strong></span>'
      +'</div>'
      +'<div class="row" style="margin-top:16px; justify-content:flex-end;">'
        +'<button class="ghost" data-act="close-modal">Cancel</button>'
        +'<button class="primary" data-act="reprice-apply">Apply</button>'
      +'</div></div></div>';
  };
}

/* ============================== settings ============================== */
function renderFieldRow(f, ctx) {
  const val = Registry.get(ctx, f.key);

    ? '<textarea data-bind="'+f.key+'" data-root="catalogue">'+escapeHtml(val)+'</textarea>'
    : '<input type="'+(f.type==='number'?'number':'text')+'" '+(f.type==='number'?'step="any"':'')+' data-bind="'+f.key+'" data-root="catalogue" value="'+escapeHtml(val)+'">';

  return '<div class="field-row">'
    +'<div class="fr-label">'+escapeHtml(f.label)+'</div>'
    +'<div>'+inputHtml+'<div class="fr-unit">'+escapeHtml(f.unit||'')+'</div></div>'
    +'<div><div class="fr-help">'+escapeHtml(f.help)+'</div>'
      +'<a class="small" data-act="toggle-field-detail" data-detail="'+detailId+'">Where this is used</a>'

function renderCataloguePanel() {
  const sections = State.catalogue.sections;
  const activeId = State.catalogueSectionTab && sections.find(s=>s.id===State.catalogueSectionTab) ? State.catalogueSectionTab : sections[0].id;
  const section = sections.find(s=>s.id===activeId);
  const tabs = sections.map(s=>'<button class="'+(s.id===activeId?'primary':'ghost')+' small" data-act="catalogue-section-tab" data-section="'+s.id+'">'+escapeHtml(s.title)+'</button>').join(' ');
  const rows = section.items.map((it,i)=>{
    const rate = Calc.itemRate(it, section, State.catalogue, {kmFromFactory: (State.catalogue.travel&&State.catalogue.travel.defaultKmFromFactory)||0});
    if (section.kind==='board') {
      return '<div class="catalogue-item-row"><input type="text" value="'+escapeHtml(it.name)+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="name">'
        +'<input type="number" step="any" value="'+it.boardCost+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="boardCost" title="board cost">'
        +'<input type="number" step="any" value="'+it.edgeCost100m+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="edgeCost100m" title="edge cost / 100m">'
        +'<select data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="cncProfile"><option value="whiteboard" '+(it.cncProfile==='whiteboard'?'selected':'')+'>whiteboard CNC</option><option value="standard" '+(it.cncProfile==='standard'?'selected':'')+'>standard CNC</option></select>'
        +'<div class="dim small right">= '+fmtMoney(rate)+'</div>'
        +'<button class="ghost small" data-act="remove-catalogue-item" data-section="'+section.id+'" data-idx="'+i+'">×</button></div>';
    }
    if (section.kind==='travel') {
      return '<div class="catalogue-item-row"><input type="text" value="'+escapeHtml(it.name)+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="name">'
        +'<input type="number" step="any" value="'+it.perKm+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="perKm" title="$/km">'
        +'<div></div><div class="dim small right">= '+fmtMoney(rate)+'/trip</div><div></div>'
        +'<button class="ghost small" data-act="remove-catalogue-item" data-section="'+section.id+'" data-idx="'+i+'">×</button></div>';
    }
    return '<div class="catalogue-item-row"><input type="text" value="'+escapeHtml(it.name)+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="name">'
      +'<input type="number" step="any" value="'+it.rate+'" data-role="cat-item-field" data-section="'+section.id+'" data-idx="'+i+'" data-f="rate" title="rate">'
      +'<div></div><div></div><div></div>'
      +'<button class="ghost small" data-act="remove-catalogue-item" data-section="'+section.id+'" data-idx="'+i+'">×</button></div>';
  }).join('');
  return '<div class="stack"><h2>Catalogue</h2><p class="dim">Every item and rate the quote engine reads from. Changing a rate here only affects new pricing — saved quotes keep their own snapshot and are unaffected.</p>'
    +'<div class="row">'+tabs+'</div>'
    +'<div style="margin-top:10px;">'+rows+'</div>'
    +'<button class="small" data-act="add-catalogue-item" data-section="'+section.id+'">+ Add item</button>'

    +'<div class="card"><h3>Bonus pool</h3><div class="dim small">pool = jobIncGst × '+c.bonus.poolPctOfTotal+' × '+c.bonus.poolMultiplier+' + (Σ room adjust / 2)</div></div>'

function renderSettings() {
  const tabs = [['company','Company'],['tiers','Pricing tiers'],['overhead','Overhead recovery'],['cnc','CNC'],['labour','Labour rates'],
    ['travel','Travel'],['cogs','COGS & margin'],['bonus','Bonus'],['catalogue','Catalogue'],['dropdowns','Dropdowns'],
    ['advisory','Hourly rate builder'],['formula','Formula reference']];
  const nav = tabs.map(t=>'<button class="'+(State.settingsTab===t[0]?'active':'')+'" data-act="settings-nav" data-tab="'+t[0]+'">'+t[1]+'</button>').join('');
  let content;
  switch (State.settingsTab) {
    case 'tiers': content = renderTiersPanel(); break;
    case 'catalogue': content = renderCataloguePanel(); break;
    case 'dropdowns': content = renderDropdownsPanel(); break;
    case 'formula': content = renderFormulaPage(); break;
    case 'labour': content = renderLabourRatesPanel(); break;
    default: content = renderSettingsGroup(State.settingsTab);
  }
  return '<div class="view"><div class="row between"><h1>Settings</h1><div class="row">'
    +'<button class="small" data-act="run-wizard-again">Run setup again</button>'

    +'<input type="file" id="catalogue-file-input" accept=".joqcat,.json" style="display:none;">'
    +'<button class="small danger" data-act="factory-reset">Reset to factory defaults</button>'
    +'</div></div>'
    +'<div class="settings-layout"><div class="settings-nav">'+nav+'</div><div>'+content+'</div></div></div>';
}

/* ============================== first-run wizard ============================== */
function wizItemBindPath(cat, sectionId, itemName) {
  const si = cat.sections.findIndex(s=>s.id===sectionId);
  const ii = cat.sections[si].items.findIndex(it=>it.name===itemName);
  return 'sections.'+si+'.items.'+ii+'.rate';
}
function wizField(label, bindPath, unit) {
  const val = getPath(State.wizardDraft, bindPath);
  return '<div style="margin-bottom:10px;"><label>'+label+'</label><div class="row"><input type="number" step="any" data-bind="'+bindPath+'" data-root="wizard" value="'+val+'" style="flex:1;"><span class="dim small">'+(unit||'')+'</span></div></div>';
}
function wizTextField(label, bindPath) {
  const val = getPath(State.wizardDraft, bindPath) || '';
  return '<div style="margin-bottom:10px;"><label>'+label+'</label><input type="text" data-bind="'+bindPath+'" data-root="wizard" value="'+escapeHtml(val)+'"></div>';
}

function renderWizardStep() {
  const d = State.wizardDraft;
  const step = State.wizardStep;
  if (step === 0) {
    return '<h2>Welcome to Joinery Quoter</h2>'
      +'<p>This tool prices joinery jobs room by room, using rates and formulas you control. A few things worth knowing up front:</p>'
      +'<ul><li>Everything stays on this machine — nothing is uploaded anywhere.</li>'
      +'<li>Quotes live in this browser, but the real backup is <strong>Save to file</strong> into your job folder (e.g. OneDrive) — do that for anything that matters.</li>'
      +'<li>Every field in the next few steps is pre-filled with a sensible default. You can skip straight to the end and fine-tune later in Settings.</li></ul>';
  }
  if (step === 1) {
    return '<h2>Your business</h2><p class="dim">Only the business name reaches the client PDF prominently — the rest is header detail.</p>'
      +wizTextField('Business name','company.name')
      +wizTextField('ABN','company.abn')
      +wizTextField('Phone','company.phone')
      +wizTextField('Email','company.email');
  }
  if (step === 2) {
    return '<h2>What you charge for time</h2><p class="dim">Charge-out rates, not wages — what a chargeable hour costs the client. You can add more rate lines later in Settings → Catalogue.</p>'
      +wizField('Office ($/hr)', wizItemBindPath(d,'officeLabour','Quote'))
      +wizField('Factory ($/hr)', wizItemBindPath(d,'factoryLabour','Assemble/Set up'))
      +wizField('Site / install ($/hr)', wizItemBindPath(d,'siteLabour','Installation'));
  }
  if (step === 3) {
    const oh = Calc.overheadHourlyRate(d);
    return '<h2>Overhead recovery</h2><p class="dim">Your quotes recover fixed running costs through the hours you quote, not a flat percentage.</p>'
      +wizField('Daily running cost','overhead.dailyRunningCost','$/day')
      +wizField('Jobs per day','overhead.jobsPerDay','jobs')
      +wizField('Hours per day','overhead.hoursPerDay','hrs')
      +'<div class="banner info">= '+fmtMoney(oh)+' recovered on every quoted hour.</div>';
  }
  if (step === 4) {
    const tiers = d.clientTiers;
    return '<h2>Pricing tiers</h2><p class="dim">Markup applies to <strong>materials only</strong> — labour and overheads always pass through at cost.</p>'
      +tiers.map((t,i)=>wizField(t.label, 'clientTiers.'+i+'.materialMarkup', '× materials')).join('');
  }
  return '<h2>Travel &amp; finish</h2><p class="dim">Default distance and per-km rates — editable per job afterwards.</p>'
    +wizField('Default km from factory','travel.defaultKmFromFactory','km')
    +wizField('Trips to measure','travel.perKmRates.Trips to measure','$/km')
    +wizField('Trips in ute','travel.perKmRates.Trips in ute','$/km')
    +wizField('Trips in truck','travel.perKmRates.Trips in truck','$/km')
    +'<div class="banner info" style="margin-top:14px;">You can fine-tune every other rate — CNC, COGS factors, bonus split, the full catalogue — later in Settings, each with a plain-English explanation.</div>';
}

function renderWizard() {
  const total = 6;
  const dots = Array.from({length:total}).map((_,i)=>'<div class="dot '+(i===State.wizardStep?'active':'')+'"></div>').join('');
  const isLast = State.wizardStep === total-1;
  return '<div class="view" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">'
    +'<div class="card wizard-modal">'
    +'<div class="wizard-dots">'+dots+'</div>'

      +'<button class="ghost" data-act="wizard-skip">Skip — use defaults</button>'
      +'<div class="row">'
        +(State.wizardStep>0?'<button data-act="wizard-back">Back</button>':'')
        +(isLast ? '<button class="primary" data-act="wizard-finish-new-quote">Create your first quote</button><button data-act="wizard-finish">Finish</button>'
