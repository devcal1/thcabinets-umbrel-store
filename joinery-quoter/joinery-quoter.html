async function commitWizard() {
  State.catalogue = deepClone(State.wizardDraft);
  await DB.putCatalogue(State.catalogue);
  await DB.setMeta('firstRunComplete', true);
  await DB.setMeta('setupVersion', State.catalogue.catalogueVersion);
}

/* ============================== print.js ============================== */
function buildPrintRoot(quote, result, catalogue) {
  const co = catalogue.company || {};
  const dateStr = new Date(quote.updatedAt||quote.createdAt).toLocaleDateString('en-AU');
  const validUntil = new Date(quote.updatedAt||quote.createdAt);
  validUntil.setDate(validUntil.getDate() + (co.quoteValidDays||30));
  const roomRows = result.rooms.filter(x=>x.r.exGst>0.005).map(x=>'<tr>'
    +'<td>'+escapeHtml(x.room.name)+'</td>'
    +'<td>'+escapeHtml(x.room.spec.doorsPanels||'—')+'</td>'
    +'<td>'+escapeHtml(x.room.spec.benchtop||'—')+'</td>'
    +'<td>'+escapeHtml(x.room.spec.jobType||'—')+'</td>'
    +'<td class="num">'+fmtMoney(x.r.exGst)+'</td></tr>').join('');
  const gst = result.jobExGst * (catalogue.gstRate||0.1);
  const optionsRows = (quote.options||[]).map(o=>{
    const room = quote.rooms.find(r=>r.id===o.roomId);
    return '<tr><td>'+escapeHtml(o.label)+'</td><td>'+(room?escapeHtml(room.name):'Whole job')+'</td><td class="num">'+fmtMoney(o.priceIncGst||0)+'</td></tr>';
  }).join('');
  return '<div class="print-page">'
    +'<div class="print-header"><div>'
      +(co.logoDataUrl ? '<img src="'+co.logoDataUrl+'" class="print-logo"/>' : '')
      +'<div class="print-company-name">'+escapeHtml(co.name||'')+'</div>'
      +'<div class="print-dim">'+escapeHtml(co.abn||'')+'</div>'
      +'<div class="print-dim">'+escapeHtml(co.phone||'')+(co.phone&&co.email?' · ':'')+escapeHtml(co.email||'')+'</div>'
    +'</div><div class="print-right">'
      +'<div class="print-title">QUOTATION</div>'
      +'<div>'+escapeHtml(quote.jobName)+'</div>'
      +'<div class="print-dim">'+escapeHtml(quote.client||'')+'</div>'
      +'<div class="print-dim">Date: '+dateStr+'</div>'
      +'<div class="print-dim">Revision: '+quote.revision+'</div>'
      +'<div class="print-dim">Valid until: '+validUntil.toLocaleDateString('en-AU')+'</div>'
    +'</div></div>'
    +'<table class="print-table"><thead><tr><th>Room</th><th>Doors / Panels</th><th>Benchtop</th><th>Type</th><th class="num">Price (ex GST)</th></tr></thead><tbody>'+roomRows+'</tbody></table>'
    +'<table class="print-totals">'
      +'<tr><td>Subtotal (ex GST)</td><td class="num">'+fmtMoney(result.jobExGst)+'</td></tr>'
      +'<tr><td>GST ('+fmtPct(catalogue.gstRate,0)+')</td><td class="num">'+fmtMoney(gst)+'</td></tr>'
      +'<tr class="print-total-row"><td>Total (inc GST)</td><td class="num">'+fmtMoney(result.jobIncGst)+'</td></tr>'
    +'</table>'
    +((quote.options||[]).length ? '<div class="print-section-title">Options</div>'
      +'<table class="print-table"><thead><tr><th>Option</th><th>Room</th><th class="num">Price</th></tr></thead><tbody>'+optionsRows+'</tbody></table>'
      +'<div class="print-note">Options are priced as alternatives to the above and are not included in the total.</div>' : '')
    +'<div class="print-section-title">Terms</div><div class="print-terms">'+escapeHtml(co.terms||'')+'</div>'
    +'</div>';
}

async function exportPdf() {
  const quote = getCurrentQuote();
  if (!quote) return;
  const catalogue = currentCatalogueForQuote(quote);
  const result = Calc.computeQuote(quote, catalogue);
  byId('print-root').innerHTML = buildPrintRoot(quote, result, catalogue);
  const prevTitle = document.title;
  document.title = 'Quote — ' + quote.jobName + ' — Rev ' + quote.revision;
  window.print();
  document.title = prevTitle;
}

/* ============================== file import/export ============================== */
async function downloadQuoteFile(quote) {
  const filename = sanitizeFilename(quote.jobName) + ' - Rev ' + quote.revision + '.joq';
  const text = JSON.stringify(quote, null, 2);
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description:'Joinery Quote', accept:{'application/json':['.joq']} }] });
      const writable = await handle.createWritable();
      await writable.write(text); await writable.close();
      State.everSavedToFile = true; await DB.setMeta('everSavedToFile', true);
      return true;
    } catch (e) { if (e && e.name==='AbortError') return false; }
  }
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  State.everSavedToFile = true; await DB.setMeta('everSavedToFile', true);
  return true;
}

function importQuoteFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let q;
    try { q = JSON.parse(reader.result); } catch(e) { toast('Not a valid quote file.'); return; }
    if (!q || !q.schemaVersion || !q.rooms) { toast('Not a valid quote file.'); return; }
    const existing = State.quotes.find(x=>x.id===q.id);
    if (existing) {
      const choice = prompt('A quote with this ID already exists ("'+existing.jobName+'"). Type "replace" to overwrite, "copy" to import as a new quote, or leave blank to cancel.');
      if (choice==='replace') { /* keep id */ }
      else if (choice==='copy') { q.id = uid(); }
      else { return; }
    }
    State.quotes = State.quotes.filter(x=>x.id!==q.id);
    State.quotes.push(q);
    await DB.putQuote(q);
    render();
    toast('Quote imported.');
  };
  reader.readAsText(file);
}

function importCatalogueFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let c;
    try { c = JSON.parse(reader.result); } catch(e) { toast('Not a valid catalogue file.'); return; }
    if (!c || !c.sections) { toast('Not a valid catalogue file.'); return; }
    if (!confirm('Replace the current catalogue with the imported one? This affects new pricing only — saved quotes keep their own snapshot.')) return;
    State.catalogue = c;
    await DB.putCatalogue(c);
    render();
    toast('Catalogue imported.');
  };
  reader.readAsText(file);
}

function downloadCatalogueFile() {
  const text = JSON.stringify(State.catalogue, null, 2);
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'catalogue.joqcat';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============================== tests.js ============================== */
const Tests = (() => {
  function approxEqual(a,b,tol) { tol = tol==null?0.01:tol; return Math.abs(a-b) <= tol; }

  function fixtureQuote() {
    const room = newRoom('Bathroom');
    room.qty = {
      officeLabour: { 'Quote':0.5, 'Nest & Order':0.5 },
      boardEdge: { 'Whiteboard':1, 'Woodmatt':1 },
      drawers: { 'DTC/Edge 178x500':2 },
      handles: { 'Fingerpull (per pull)':2 },
      hardware: { 'Blum 110d & plate':4 },
      factoryLabour: { 'Assemble/Set up':1 },
      siteLabour: { 'Installation':1 },
      travel: { 'Trips in ute':0.5 },
    };
    const quote = newQuote();
    quote.clientTier = 'T2';
    quote.kmFromFactory = 25;
    quote.rooms = [room];
    return quote;
  }

  function run() {
    const results = [];
    const t = (name, pass, detail) => results.push({ name, pass: !!pass, detail: detail==null?'':String(detail) });
    const catalogue = deepClone(SEED_CATALOGUE);
    const quote = fixtureQuote();
    const res = Calc.computeQuote(quote, catalogue);
    const rr = res.rooms[0].r;

    t('cncPerSheet(whiteboard) ≈ 34.8333', approxEqual(Calc.cncPerSheet(catalogue,'whiteboard'), 34.8333, 0.01), Calc.cncPerSheet(catalogue,'whiteboard').toFixed(4));
    t('cncPerSheet(standard) ≈ 36.1429', approxEqual(Calc.cncPerSheet(catalogue,'standard'), 36.1429, 0.01), Calc.cncPerSheet(catalogue,'standard').toFixed(4));

    const boardSection = catalogue.sections.find(s=>s.id==='boardEdge');
    const whiteboardItem = boardSection.items.find(i=>i.name==='Whiteboard');
    const woodmattItem = boardSection.items.find(i=>i.name==='Woodmatt');
    t('rate Whiteboard ≈ 97.3333', approxEqual(Calc.itemRate(whiteboardItem, boardSection, catalogue, quote), 97.3333, 0.01));
    t('rate Woodmatt ≈ 209.8929', approxEqual(Calc.itemRate(woodmattItem, boardSection, catalogue, quote), 209.8929, 0.01));

    t('labourOffice = 93.00', approxEqual(rr.labourOffice, 93.00), rr.labourOffice.toFixed(2));
    t('boardEdge subtotal ≈ 307.2262', approxEqual(rr.bySection['boardEdge'], 307.2262, 0.01), rr.bySection['boardEdge'].toFixed(4));
    t('drawers subtotal = 76.00', approxEqual(rr.bySection['drawers'], 76.00));
    t('handles subtotal = 40.00', approxEqual(rr.bySection['handles'], 40.00));
    t('hardware subtotal = 22.00', approxEqual(rr.bySection['hardware'], 22.00));
    t('materials ≈ 445.2262', approxEqual(rr.materials, 445.2262, 0.01), rr.materials.toFixed(4));
    t('markup (T2) ≈ 151.3769', approxEqual(rr.markup, 151.3769, 0.01), rr.markup.toFixed(4));
    t('labourWorkshop = 179.00', approxEqual(rr.labourWorkshop, 179.00));
    const ohHours = rr.officeHours+rr.factoryHours+rr.siteHours+rr.travelHours;
    t('overhead hours ≈ 2.41667', approxEqual(ohHours, 2.41667, 0.001), ohHours.toFixed(5));
    t('overheadRecovery ≈ 140.9722', approxEqual(rr.overheadRecovery, 140.9722, 0.01), rr.overheadRecovery.toFixed(4));
    t('travelCost = 35.00', approxEqual(rr.travelCost, 35.00));
    t('overheads ≈ 175.9722', approxEqual(rr.overheads, 175.9722, 0.01));
    t('exGst ≈ 1044.5753', approxEqual(rr.exGst, 1044.5753, 0.01), rr.exGst.toFixed(4));
    t('incGst ≈ 1149.0328', approxEqual(rr.incGst, 1149.0328, 0.01), rr.incGst.toFixed(4));
    t('cogs ≈ 842.5210', approxEqual(rr.cogs, 842.5210, 0.01), rr.cogs.toFixed(4));
    t('cogsRatio ≈ 0.73324', approxEqual(rr.cogsRatio, 0.73324, 0.001), rr.cogsRatio.toFixed(5));
    t('profit ≈ 306.5118', approxEqual(rr.profit, 306.5118, 0.01), rr.profit.toFixed(4));

    const quoteT4 = deepClone(quote); quoteT4.clientTier='T4';
    const resT4 = Calc.computeQuote(quoteT4, catalogue).rooms[0].r;
    t('T4 tier changes only markup', approxEqual(resT4.materials, rr.materials) && approxEqual(resT4.labourOffice, rr.labourOffice)
      && approxEqual(resT4.labourWorkshop, rr.labourWorkshop) && approxEqual(resT4.overheads, rr.overheads)
      && approxEqual(resT4.markup, 227.0654, 0.01), 'T4 markup='+resT4.markup.toFixed(4));

    const quoteAdj = deepClone(quote); quoteAdj.rooms[0].adjust = 0.1;
    const resAdj = Calc.computeQuote(quoteAdj, catalogue).rooms[0].r;
    t('adjust +10% scales base by 1.1', approxEqual(resAdj.exGst, rr.base*1.1, 0.01));

    const quoteZero = newQuote(); quoteZero.rooms = [newRoom('Empty')];
    const resZero = Calc.computeQuote(quoteZero, catalogue).rooms[0].r;
    t('zero-qty room: exGst=0, no NaN, no warning', resZero.exGst===0 && !isNaN(resZero.exGst) && !resZero.warnCogs);

    const diffSame = diffCatalogues(catalogue, catalogue, quote);
    t('re-price against identical catalogue: zero diff', diffSame.length===0, diffSame.length+' changes');

    const printResult = Calc.computeQuote(quote, catalogue);
    const printHtml = buildPrintRoot(quote, printResult, catalogue);
    const forbidden = ['COGS','Markup','Overhead','Adjust','Profit','Margin','Bonus','Materials','Labour'];
    const tmp = document.createElement('div'); tmp.innerHTML = printHtml;
    const text = tmp.textContent.toLowerCase();
    const leaked = forbidden.filter(w=> text.includes(w.toLowerCase()));
    t('print output has no internal-cost leakage', leaked.length===0, leaked.join(', '));

    const exported = JSON.stringify(quote);
    const imported = JSON.parse(exported);
    const resOrig = Calc.computeQuote(quote, catalogue).jobIncGst;
    const resImp = Calc.computeQuote(imported, catalogue).jobIncGst;
    t('.joq round-trip: identical totals', approxEqual(resOrig, resImp, 0.001));

    let registryOk = true, registryDetail = '';
    Registry.fields.forEach(f => { const v = Registry.get(catalogue, f.key); if (v===undefined) { registryOk=false; registryDetail += f.key+' unresolved; '; } });
    t('registry: every field key resolves against seed catalogue', registryOk, registryDetail);

    let examplesOk = true, exDetail='';
    Registry.fields.forEach(f => { try { const ex = f.example(catalogue); if (!ex) { examplesOk=false; exDetail+=f.key+' empty; '; } } catch(e){ examplesOk=false; exDetail+=f.key+' threw; '; } });
    t('registry: every example() returns non-empty', examplesOk, exDetail);

    return results;
  }

  return { run, fixtureQuote, approxEqual };
})();

function renderTests() {
  const results = Tests.run();
  const pass = results.filter(r=>r.pass).length;
  const rows = results.map(r=>'<tr><td>'+(r.pass?'<span class="chip good">PASS</span>':'<span class="chip bad">FAIL</span>')+'</td><td>'+escapeHtml(r.name)+'</td><td class="dim small">'+escapeHtml(r.detail)+'</td></tr>').join('');
  return '<div class="view">'
    +'<h1>Self-tests</h1><p class="dim">Acceptance tests from the build plan, reproducing the Bathroom column of the source workbook to the cent.</p>'
    +'<div class="banner '+(pass===results.length?'info':'bad')+'">'+pass+' / '+results.length+' passed</div>'
    +'<table style="margin-top:14px;"><thead><tr><th></th><th>Test</th><th>Detail</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="row" style="margin-top:16px;"><button data-act="nav" data-route="dashboard">← Back</button></div>'
    +'</div>';
}

}

function computeOptionDelta(quote, catalogue, roomId, substitution) {
  const room = quote.rooms.find(r=>r.id===roomId);
  if (!room) return 0;
  const cloneRoom = deepClone(room);
  const qtyMap = cloneRoom.qty[substitution.sectionId] || {};
  const q = qtyMap[substitution.fromItem] || 0;
  delete qtyMap[substitution.fromItem];
  qtyMap[substitution.toItem] = (qtyMap[substitution.toItem]||0) + q;
  cloneRoom.qty[substitution.sectionId] = qtyMap;
  const origResult = Calc.computeRoom(room, catalogue, quote);
  const newResult = Calc.computeRoom(cloneRoom, catalogue, quote);
  return newResult.incGst - origResult.incGst;
}

window.State = State;
window.getCurrentQuote = getCurrentQuote;

/* ============================== bootstrap ============================== */
initApp();
