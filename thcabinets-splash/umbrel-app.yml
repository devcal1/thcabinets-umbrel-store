id: thcabinets-splash
name: TH Cabinets
tagline: Company landing page, job photo search, and manufacturing/install schedule
icon: https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
category: files
version: "1.9.0"
port: 4090
description: >-
  A landing page for TH Cabinets, with a showroom photo search tool for
  browsing past job photos by keyword, an admin page for uploading and
  tagging new job photos, and a live manufacturing/installing schedule board
  that replaces the whiteboard-and-magnets fortnightly schedule.
developer: TH Cabinets
website: ""
submitter: TH Cabinets
submission: ""
repo: https://github.com/devcal1/thcabinets-umbrel-store
support: https://github.com/devcal1/thcabinets-umbrel-store/issues
gallery:
  - https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
releaseNotes: >-
  Jobs no longer get left behind as the weeks go by. Each week now has a
  "Finish week" button at the bottom: it lists every job in the week and asks
  where it is up to - not started, still manufacturing, ready to install, or
  complete. Press Done and next week is set up for you: still-manufacturing
  jobs appear in next week's manufacturing list and ready-to-install jobs in
  its installing list, each with the same workers, and not-started jobs go
  into a new "To start" list on the left of the board. Jobs in "To start" can
  be added by hand and dragged into Manufacturing or Installing. The print
  and JPG exports are unchanged and don't include the "To start" list.
