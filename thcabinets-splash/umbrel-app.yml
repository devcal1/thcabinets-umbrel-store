  - https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
releaseNotes: >-
  The schedule board no longer asks for the Umbrel login. Point the workshop
  TV (or any device on the shop network) straight at /schedule.html and it
  loads ready to view and edit — no sign-in, just like walking up to the old
  whiteboard. Everything else is unchanged: the landing page, photo search,
  photo admin, and worker management still sit behind the Umbrel login.
