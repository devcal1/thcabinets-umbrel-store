releaseNotes: >-
  New "Completed" list on the right of the schedule board. When you press
  "Finish week" and mark a job complete, it now moves into Completed (newest
  first, with the week it was finished) instead of simply disappearing. A
  Reopen button on each entry sends it back to "To start" if it was marked
  complete by mistake, and scheduling a completed job again takes it out of
  the list. The Completed list can be folded down to a thin strip with its
  arrow button to give the weeks more room - the board remembers your choice on
  each screen. Print and JPG exports don't include it.


  Also in this update (from 1.9.0): jobs no longer get left behind as the
  weeks go by. Each week now has a
  "Finish week" button at the bottom: it lists every job in the week and asks
  where it is up to - not started, still manufacturing, ready to install, or
  complete. Press Done and next week is set up for you: still-manufacturing
  jobs appear in next week's manufacturing list and ready-to-install jobs in
  its installing list, each with the same workers, and not-started jobs go
  into a new "To start" list on the left of the board, next to the title and worker names, which makes room for more jobs on screen. Scheduled jobs can also be dragged back onto "To start". Jobs in "To start" can
  be added by hand and dragged into Manufacturing or Installing. The print
  and JPG exports are unchanged and don't include the "To start" list.
