  - https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
releaseNotes: >-
  Tag suggestions now use Gemini's structured JSON output instead of parsing
  free text, fixing low-quality/garbled suggestions caused by the model not
  always following the "comma-separated list only" instruction. Errors from
  the suggestion API now surface a real message instead of a generic one.
  Upload-form photo previews are now much larger and show the full photo at
  its true aspect ratio instead of a small cropped square.
