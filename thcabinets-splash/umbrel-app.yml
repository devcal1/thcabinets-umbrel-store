releaseNotes: >-
  The schedule board now shows one week at a time and uses the full width of
  the screen, so the week you're looking at is bigger and easier to read from
  across the workshop. Jobs can be dragged up and down by the grip handle to
  reorder them, and two new arrow buttons move a job — along with everyone
  assigned to it — to the previous or next week. Days with three or four
  workers now show them two-by-two instead of in one tall stack, which keeps
  rows short. Manufacturing and installing jobs line up on the same row
  whenever they share a name, not only when they were added as the same job.
  Also fixes the flag icon disappearing on days marked locked-in with the
  client. The JPG export matches all of this.
