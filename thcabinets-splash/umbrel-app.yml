repo: https://github.com/devcal1/thcabinets-umbrel-store
support: https://github.com/devcal1/thcabinets-umbrel-store/issues
gallery:
  - https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
releaseNotes: >-
  New: a live Schedule board at /schedule.html, replacing the paper
  whiteboard for weekly manufacturing/installing planning. Jobs are rows,
  Mon-Fri are columns, split into Manufacturing and Installing panels per
  week, with colour-coded worker chips per day — browse any past or future
  week, add/rename/reorder/duplicate job rows, and export a week as PDF or
  JPG. A Workers page manages the crew roster and chip colours. The splash
  page now also links directly to the photo upload/admin tool.
