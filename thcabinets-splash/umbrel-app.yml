id: thcabinets-splash
name: TH Cabinets
tagline: Company landing page, job photo search, and manufacturing/install schedule
icon: https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
category: files
version: "1.5.0"
port: 4090
description: >-
  A landing page for TH Cabinets, with a showroom photo search tool for
  browsing past job photos by keyword, an admin page for uploading and
  tagging new job photos, and a live manufacturing/installing schedule board
  that replaces the whiteboard-and-magnets fortnightly schedule.
developer: TH Cabinets
website: ""
submitter: TH Cabinets
