gallery:
  - https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
releaseNotes: >-
  Fixed tag suggestions using a since-retired Gemini model (now defaults to
  gemini-3.6-flash). Fixed batch/bulk uploads reporting a whole folder as
  "failed" when only one photo in it had a problem — uploads now process each
  photo independently and report exactly which one(s) failed and why, instead
  of silently discarding the real error. Admin photo-list thumbnails are much
  bigger (64px to 160px) so it's easier to judge a photo while tagging it.
