  - https://raw.githubusercontent.com/devcal1/thcabinets-umbrel-store/master/thcabinets-splash/icon.svg
releaseNotes: >-
  Schedule board improvements. Within each week, a job that appears on both
  the manufacturing and installing sides now sits on the same line, with
  blank space filling the gaps — so you can read straight across the board.
  Jobs with notes now show their note icon in bright orange, so it's obvious
  at a glance which jobs have extra detail behind them. Both changes carry
  through to the JPG export.
