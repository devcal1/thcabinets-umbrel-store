releaseNotes: >-
  Schedule board now shows dates the Australian way — 4/9/26 for the 4th of
  September — in the week headings and on each day column. Weeks are also set
  apart more clearly: a coloured line and a bigger gap between them, and the
  week's dates stay pinned at the top as you scroll, so it's harder to drift
  into the next week without noticing. The JPG export matches.
