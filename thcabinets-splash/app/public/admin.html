<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH Cabinets — Photo Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="page">
    <h1>Photo Admin</h1>
    <p class="text-muted">Upload job photos and tag them so they show up in the search page. Not linked publicly — bookmark this page.</p>

    <form class="card" id="upload-form">
      <div class="upload-row">
        <div class="field" style="flex:2">
          <label for="files">Photos</label>
          <input class="input" type="file" id="files" name="photos" accept="image/jpeg,image/png,image/webp" multiple required>
        </div>
        <div class="field" style="flex:2">
          <label for="tags">Tags (comma-separated, applied to all selected photos)</label>
          <input class="input" type="text" id="tags" name="tags" placeholder="kitchen, farmhouse, oak, matte black hardware">
        </div>
        <button class="btn btn-primary" type="submit" id="upload-btn">Upload</button>
      </div>
      <div class="status" id="upload-status"></div>
    </form>

    <div class="table-wrap">
      <table class="table" id="photo-table">
        <thead>
          <tr>
            <th>Photo</th>
            <th>Tags</th>
            <th>Uploaded</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="photo-tbody">
          <tr><td colspan="4" class="text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
